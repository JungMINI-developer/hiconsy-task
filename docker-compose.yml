services:
  postgres:
    image: postgres:16-alpine
    container_name: hiconsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hiconsy
      POSTGRES_PASSWORD: hiconsy
      POSTGRES_DB: hiconsy
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hiconsy -d hiconsy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
